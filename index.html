<html lang="tr">
<head>

<style>
  :root { --bg:#16191b; --panel:#1f2326; --line:#3a4044; --text:#ece8df; --mute:#9aa0a3; --amber:#e8a94a;
          --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden;
    overscroll-behavior:none; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  #bar { position:fixed; left:calc(12px + var(--sl)); right:calc(12px + var(--sr)); bottom:calc(12px + var(--sb)); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  @media (hover:hover) { button:hover { border-color:var(--amber); } }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--amber); color:#1b1408; border-color:var(--amber); }
  .sep { width:1px; background:var(--line); margin:0 4px; }
  #tLeg { display:none; }
  #head { position:fixed; left:calc(14px + var(--sl)); right:calc(14px + var(--sr)); top:calc(12px + var(--st)); pointer-events:none; }
  #head h1 { margin:0; font-size:18px; font-weight:600; }
  #head p { margin:2px 0 0; font-size:13px; color:var(--mute); }
  .lbl { position:fixed; left:0; top:0; transform:translate(-50%,-50%); will-change:transform; font-size:12px; padding:2px 7px; border-radius:6px; background:rgba(22,25,27,.82); border:1px solid var(--line); color:var(--text); }
  #legend { position:fixed; right:calc(12px + var(--sr)); top:calc(12px + var(--st)); background:rgba(31,35,38,.9); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; }
  #legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:7px; vertical-align:-1px; }

  @media (max-width:760px), (max-height:500px) {
    #head h1 { font-size:16px; }
    #head p { font-size:12px; }
    #bar { flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; touch-action:pan-x; -webkit-overflow-scrolling:touch; }
    #bar::-webkit-scrollbar { display:none; }
    #bar::before, #bar::after { content:''; margin:auto; flex:none; }
    #bar > * { flex:none; }
    button { padding:8px 12px; font-size:13px; }
    #tLeg { display:inline-block; }
    #legend { display:none; right:auto; top:auto; left:calc(12px + var(--sl)); bottom:calc(68px + var(--sb)); }
    #legend.show { display:block; }
    .lbl { font-size:11px; padding:1px 6px; }
  }
  @media (max-height:500px) { #head p { display:none; } }
  @media (pointer:coarse) { button { min-height:44px; } }

  #gal { position:fixed; inset:0; z-index:30; background:rgba(14,16,17,.98); display:none; overflow-y:auto; -webkit-overflow-scrolling:touch; user-select:none; }
  #gal.show { display:block; }
  .ghead { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(10px + var(--st)) calc(14px + var(--sr)) 10px calc(14px + var(--sl)); background:rgba(22,25,27,.94); }
  .ghead h2 { margin:0; font-size:17px; font-weight:600; }
  .gbody { padding:6px calc(14px + var(--sr)) calc(24px + var(--sb)) calc(14px + var(--sl)); max-width:1200px; margin:0 auto; }
  .gbody h3 { margin:18px 0 8px; font-size:13px; font-weight:600; color:var(--amber); letter-spacing:.04em; text-transform:uppercase; }
  .ggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .gitem { padding:0; text-align:left; overflow:hidden; display:block; white-space:normal; }
  .gitem img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .gitem span { display:block; padding:8px 10px; font-size:13px; color:var(--text); }
  #lb { position:fixed; inset:0; z-index:40; background:rgba(8,9,10,.97); display:none; flex-direction:column; align-items:center; justify-content:center; touch-action:pan-y; }
  #lb.show { display:flex; }
  #lb img { max-width:100%; max-height:calc(100% - 120px); object-fit:contain; }
  #lbCap { margin:10px 70px 0; font-size:14px; text-align:center; color:var(--text); min-height:20px; }
  #lbCnt { font-size:12px; color:var(--mute); margin-top:4px; }
  .lbb { position:absolute; }
  #lbX { top:calc(10px + var(--st)); right:calc(12px + var(--sr)); }
  #lbP { left:calc(10px + var(--sl)); top:50%; transform:translateY(-50%); }
  #lbN { right:calc(10px + var(--sr)); top:50%; transform:translateY(-50%); }

  #gal input, #gal select { -webkit-user-select:text; user-select:text; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; font-size:14px; }
  .gcard { position:relative; }
  .gdel { position:absolute; top:6px; right:6px; padding:4px 9px; min-height:0 !important; background:rgba(120,30,30,.92); border-color:#b44; font-size:12px; }
  #gAdm, #gPw { display:none; margin:14px 0 4px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  #gAdm.show, #gPw.show { display:block; }
  .grow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .gnote { font-size:12px; color:var(--mute); margin:6px 0 0; }
  #gErr { color:#ff8a7a; font-size:13px; }
</style>

<script>
const S = 1/10.95;
const X = v => (v-40)*S, Z = v => (v-30)*S;

const M = (c,o=1) => new THREE.MeshLambertMaterial({color:c,transparent:o<1,opacity:o,side:THREE.DoubleSide,depthWrite:o>=1});
const mats = {
  wall:M(0xe9e4d9), outer:M(0xd2ccbf), glass:M(0x9fc4d8,.28), frame:M(0x23272a),
  floorOpen:M(0xbfd9cc), floorIn:M(0xe6dfd0), shaft:M(0x3a3a3a),

};
function box(x0,z0,x1,z1,y0,y1,mat,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(X(x1)-X(x0)),y1-y0,Math.abs(Z(z1)-Z(z0))),mat);
  m.position.set((X(x0)+X(x1))/2,(y0+y1)/2,(Z(z0)+Z(z1))/2);
  parent.add(m); return m;
}
const T = 0.1/S;
function wall(x0,y0,x1,y1,mat,h=3.2,yb=0,t=T,parent=scene){
  if(y0===y1) return box(x0,y0-t,x1,y0+t,yb,yb+h,mat,parent);
  return box(x0-t,y0,x0+t,y1,yb,yb+h,mat,parent);
}

box(40,30,207.5,615,-0.2,0,mats.floorOpen);
box(207.5,152.5,342.5,507.5,-0.2,0,mats.floorIn);

  const px=t=>x0+(x1-x0)*t, py=t=>y0+(y1-y0)*t;
  for(let i=0;i<n;i++){
    const m=wall(px(i/n),py(i/n),px((i+1)/n),py((i+1)/n),mats.glass,2.3,0.9,0.4);
    m.geometry.translate(0,1.15,0); m.position.y=0.9; wins.push(m);
  }
};
const fr = (x0,y0,x1,y1,h,yb)=>wall(x0,y0,x1,y1,mats.frame,h,yb,0.8);
gl(40,30,40,212.5); gl(40,237.5,40,440); gl(40,465,40,615);

[[212.5],[237.5],[440],[465]].forEach(p=>fr(40,p[0],40,p[0],3.2,0));

wall(40,30,207.5,30,mats.outer,3.2); gl(40,615,207.5,615);   // kuş bakışında üstte kalan yan cephe: cam yerine DUVAR

for(let y=30;y<=615;y+=97.5){ fr(40,y,40,y,3.4,0); }
wall(207.5,30,207.5,152.5,mats.outer); wall(207.5,507.5,207.5,615,mats.outer);

const roof = new THREE.Group(); scene.add(roof);
const slats=[], sm=M(0x9fb4be,.45), nS=12;
const RX0=X(43), RX1=X(204.5), RW=(RX1-RX0)/nS;
[[30,152.5],[507.5,615]].forEach(zn=>{ const zc=(Z(zn[0])+Z(zn[1]))/2, zl=(Z(zn[1])-Z(zn[0]))*0.99;
  for(let i=0;i<nS;i++){ const m=new THREE.Mesh(new THREE.BoxGeometry(RW*0.985,0.05,zl),sm); m.position.set(RX0+RW*(i+.5),3.3,zc); m.userData={cx:RX0+RW*(i+.5),ox:RX1-RW/2,i}; roof.add(m); slats.push(m); }
});
box(40,151.5,207.5,153.5,3.2,3.45,mats.frame,roof); box(40,506.5,207.5,508.5,3.2,3.45,mats.frame,roof);
box(40,30,43,615,3.2,3.45,mats.frame,roof); box(204.5,30,207.5,615,3.2,3.45,mats.frame,roof);

box(12,30,40,615,-0.2,0,M(0xc9c2b4)); box(12,2,207.5,30,-0.2,0,M(0xc9c2b4));
const planter=M(0xb5694a), fol=new THREE.InstancedMesh(new THREE.SphereGeometry(.17,8,6),M(0x3f7d3a),600);
const fcol=[0xe0425a,0xf29bb5,0xf4c542,0xb08ae8], fl=fcol.map(c=>new THREE.InstancedMesh(new THREE.SphereGeometry(.07,6,5),M(c),220));
let nf=0; const fnC=[0,0,0,0], mm=new THREE.Matrix4(), rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
const putI=(im,i,x,y,z)=>{ mm.makeTranslation(x,y,z); im.setMatrixAt(i,mm); };
const rail=(y0,y1)=>{ box(12.2,y0,12.8,y1,1.0,1.06,mats.frame); box(12.4,y0,12.6,y1,0.5,0.54,mats.frame); box(13.2,y0,18,y1,0,.42,planter);
  const n=Math.max(1,Math.round((y1-y0)/22)); for(let i=0;i<=n;i++){ const y=y0+(y1-y0)*i/n; box(12.2,y-.4,12.8,y+.4,0,1.1,mats.frame); }
  const c=Math.round((y1-y0)/3.2); for(let i=0;i<c;i++){ const y=y0+(y1-y0)*(i+.5)/c;
    if(nf<600) putI(fol,nf++,X(14.5+rnd()*2.5),.5,Z(y+(rnd()-.5)*2)); const k=Math.floor(rnd()*4);
    for(let j=0;j<2;j++) if(fnC[k]<220) putI(fl[k],fnC[k]++,X(14.2+rnd()*3),.58+rnd()*.15,Z(y+(rnd()-.5)*3)); } };

const railX=(x0,x1)=>{ box(x0,1.7,x1,2.3,1.0,1.06,mats.frame); box(x0,1.9,x1,2.1,.5,.54,mats.frame); box(x0,2.8,x1,7.5,0,.42,planter);
  const n=Math.round((x1-x0)/22); for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n; box(x-.4,1.7,x+.4,2.3,0,1.1,mats.frame); }
  const c=Math.round((x1-x0)/3.2); for(let i=0;i<c;i++){ const x=x0+(x1-x0)*(i+.5)/c;
    if(nf<600) putI(fol,nf++,X(x+(rnd()-.5)*2),.5,Z(3.8+rnd()*2.5)); const k=Math.floor(rnd()*4);
    for(let j=0;j<2;j++) if(fnC[k]<220) putI(fl[k],fnC[k]++,X(x+(rnd()-.5)*3),.58+rnd()*.15,Z(3.2+rnd()*3.5)); } };
rail(2,30); railX(12,207.5);
box(207.2,2,207.8,30,1.0,1.06,mats.frame); box(207.2,2,207.8,30,0.5,0.54,mats.frame);
scene.add(fol); fl.forEach(m=>{ m.count=fnC[fl.indexOf(m)]; scene.add(m); }); fol.count=nf;

wall(207.5,152.5,342.5,152.5,mats.outer); wall(342.5,152.5,342.5,507.5,mats.outer); wall(207.5,507.5,342.5,507.5,mats.outer);

const sh = box(265,316.25,341.4,343.75,0,3.2,mats.shaft);
const ln = new THREE.LineSegments(new THREE.EdgesGeometry(sh.geometry),new THREE.LineBasicMaterial({color:0xe8a94a}));
ln.position.copy(sh.position); scene.add(ln);

[[219,222],[249,222],[270,224],[289,224],[309,198],[309,257],[216,346],[216,449],[257,449],[286,449]].forEach(c=>{ if(c[0]===309&&c[1]===198) return; box(c[0],c[1],c[0]+7,c[1]+7,0,3.2,mats.col); });

wall(324,152.5,324,170,mats.purple); wall(324,182,324,198,mats.purple); wall(324,170,324,182,mats.frame,1.0,2.2,0.5);

const SY0=205, SY1=316.25, SY2=343.75;
box(295,SY0,324,SY1,-0.05,0.02,M(0xf2c6b5));
box(324,SY0,342.5,SY1,-0.05,0.02,M(0xe8e0d6));
box(341.4,SY1,342.5,SY2,0,3.2,mats.shaft);

box(295,SY0+2,299,301,0,1.1,mats.coralD); box(294.6,SY0+2,299.4,301,1.1,1.16,mats.col);
wall(295,313,295,SY1,mats.coral,3.2,0,0.5); doorY(295,301,313);
wall(324,SY0,324,254.5,mats.coral,3.2,0,0.5);
wall(324,254.5,324,268.5,mats.coral,1.0,0,0.5); wall(324,254.5,324,268.5,mats.coral,1.0,2.2,0.5);

[0x3b3f43,0x33373a,0x2c2f32,0x26292b,0x202224,0x1a1c1e,0x141517].forEach((c,i)=>box(326+i*2.1,346,328+i*2.1,371.8,0.021,0.03,M(c)));

box(324,VY,342.5,507.5,-0.05,0.02,M(0xe3d9c7));
const doorX=(y,a,b)=>{ box(a-0.4,y-0.5,a+0.4,y+0.5,0,2.2,mats.wood); box(b-0.4,y-0.5,b+0.4,y+0.5,0,2.2,mats.wood); wall(a,y,b,y,mats.wood,1.0,2.2,0.7); };
const doorYw=(x,a,b)=>{ box(x-0.5,a-0.4,x+0.5,a+0.4,0,2.2,mats.wood); box(x-0.5,b-0.4,x+0.5,b+0.4,0,2.2,mats.wood); wall(x,a,x,b,mats.wood,1.0,2.2,0.7); };
function partX(y,gaps){ let px=324; gaps.forEach(g=>{ wall(px,y,g[0],y,mats.panel,3.2,0,0.5); doorX(y,g[0],g[1]); px=g[1]; }); wall(px,y,342.5,y,mats.panel,3.2,0,0.5); }
wall(324,SY2,324,378,mats.wcw,3.2,0,0.5); doorY(324,378,387);
wall(324,387,324,471,mats.wcw,3.2,0,0.5); doorY(324,471,480);

  const r=Math.min(MAXR,Math.max(v.r,v.w*0.9/(0.83*a)));
  const az=(n==='persp'&&a<0.8)?-0.55:v.az;
  return {az,el:v.el,r,tx:target.x,tz:target.z};
}
const st={...getView('persp')};
const goal={...st};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{exitWalk();curView=b.dataset.v;moved=false;Object.assign(goal,getView(curView));});
function tog(id,fn){const b=document.getElementById(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);};}
let walk=false,wx=0,wz=0,wgx=0,wgz=0,wy=0,wp=0,wfov=70;
const hintEl=document.getElementById('hint'); let hintOrbit='';
function exitWalk(){ if(!walk) return; walk=false; document.getElementById('tWalk').setAttribute('aria-pressed','false'); hintEl.textContent=hintOrbit; }
let roofG=0,winG=0,roofT=0,winT=0;
tog('tWalk',on=>{ if(on){ wx=wgx=st.tx; wz=wgz=st.tz; wy=-st.az; wp=0; wfov=70; walk=true; hintOrbit=hintEl.textContent; hintEl.textContent='Tek parmak: etrafa bak · İki parmak: yakınlaştır · Çift dokun: o noktaya git'; } else exitWalk(); });
tog('tRoof',o=>{roofG=o?1:0;document.getElementById('tRoof').textContent=o?'Yan çatıyı kapat':'Yan çatıyı aç';});
tog('tWin',o=>{winG=o?1:0;document.getElementById('tWin').textContent=o?'Camları kapat':'Camları aç';});
tog('tInt',o=>interior.visible=o); tog('tBld',o=>bld.visible=o); tog('tLbl',o=>labels.forEach(l=>l.el.style.display=o?'':'none'));
tog('tLeg',o=>document.getElementById('legend').classList.toggle('show',o));
document.getElementById('hint').textContent='Sürükle: döndür · Tekerlek / iki parmak: yakınlaştır · Sağ tık: kaydır';
const ptrs=new Map(); let pd=0,pmx=null,pmy=null;
function panBy(dx,dy){
  const k=goal.r*0.0016;
  goal.tx+=(-Math.cos(goal.az)*dx+Math.sin(goal.az)*dy*Math.sin(goal.el))*k;
  goal.tz+=( Math.sin(goal.az)*dx+Math.cos(goal.az)*dy*Math.sin(goal.el))*k;
  goal.tx=clamp(goal.tx,target.x-45,target.x+45); goal.tz=clamp(goal.tz,target.z-45,target.z+45);
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey});pd=0;pmx=null;});
const endPtr=e=>{ptrs.delete(e.pointerId);pd=0;pmx=null;};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  moved=true;
  if(walk){
    if(ptrs.size===2){ const o=[...ptrs.entries()].find(a=>a[0]!==e.pointerId)[1]; const nd=Math.hypot(e.clientX-o.x,e.clientY-o.y); if(pd&&nd>0) wfov=clamp(wfov*pd/nd,25,90); pd=nd; }
    else { const k=0.005*(wfov/70); wy-=dx*k; wp=clamp(wp+dy*k,-1.3,1.3); }
    p.x=e.clientX; p.y=e.clientY; return;
  }
  if(ptrs.size===2){
    const o=[...ptrs.entries()].find(a=>a[0]!==e.pointerId)[1];
    const nd=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    const mx=(e.clientX+o.x)/2, my=(e.clientY+o.y)/2;
    if(pd&&nd>0) goal.r=clamp(goal.r*pd/nd,MINR,MAXR);
    if(pmx!==null) panBy(mx-pmx,my-pmy);
    pd=nd; pmx=mx; pmy=my;
  } else if(p.b===2||p.s){ panBy(dx,dy); }
  else { goal.az-=dx*0.006; goal.el=clamp(goal.el+dy*0.006,0.05,1.55); }
  p.x=e.clientX; p.y=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();moved=true; if(walk){ wfov=clamp(wfov*(1+e.deltaY*0.001),25,90); return; }goal.r=clamp(goal.r*(1+e.deltaY*0.001),MINR,MAXR);},{passive:false});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
let W=innerWidth,H=innerHeight;
function resize(){
  W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
  renderer.setSize(W,H,false); cam.aspect=W/H; cam.updateProjectionMatrix();
  if(!moved){ const v=getView(curView); Object.assign(goal,v); }
}
if('ResizeObserver' in window) new ResizeObserver(resize).observe(cv); else addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();
const v3=new THREE.Vector3(); let lastT=performance.now();
(function loop(){
  requestAnimationFrame(loop);
  for(const k of ['az','el','r','tx','tz']) st[k]+=(goal[k]-st[k])*0.12;
  const ty=Math.max(0,Math.min(1,(18-st.r)/18))*1.4; cam.position.set(st.tx+st.r*Math.cos(st.el)*Math.sin(st.az), ty+st.r*Math.sin(st.el), st.tz+st.r*Math.cos(st.el)*Math.cos(st.az));
  const nowT=performance.now(), dt=Math.min(0.05,(nowT-lastT)/1000); lastT=nowT;
  roofT+=clamp(roofG-roofT,-dt/3.5,dt/3.5); winT+=(winG-winT)*0.06;
  slats.forEach(m=>{ const u=m.userData, d=u.i/(nS-1)*0.55; const f=clamp((roofT-d)/0.45,0,1), e=f*f*(3-2*f); m.position.x=u.cx+(u.ox-u.cx)*e; m.position.y=3.3+(nS-1-u.i)*0.07*Math.min(1,f*6); });
  wins.forEach(w=>w.scale.y=Math.max(0.02,1-winT));
  cam.up.set(0,1,0); cam.lookAt(st.tx,ty,st.tz);
  if(walk){
    wx+=(wgx-wx)*.12; wz+=(wgz-wz)*.12; cam.fov+=(wfov-cam.fov)*.25; cam.updateProjectionMatrix();
    cam.position.set(wx,1.6,wz);
    cam.lookAt(wx+Math.sin(wy)*Math.cos(wp),1.6+Math.sin(wp),wz-Math.cos(wy)*Math.cos(wp));
  } else if(cam.fov!==45){ cam.fov=45; cam.updateProjectionMatrix(); }
  renderer.render(scene,cam);
  labels.forEach(l=>{ v3.copy(l.p).project(cam); const ok=v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1; l.el.style.visibility=ok?'visible':'hidden'; l.el.style.transform='translate('+((v3.x+1)/2*W)+'px,'+((1-v3.y)/2*H)+'px) translate(-50%,-50%)'; });
})();
</script>
